name: Build & Push EKS Job Runner Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and push (e.g. 0.3)"
        required: true
        type: string

env:
  IMAGE: tech4dev/prefect-eks-job-runner

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Fail if image tag already exists
        run: |
          TARGET="${IMAGE}:${{ inputs.image_tag }}"
          if docker manifest inspect "$TARGET" > /dev/null 2>&1; then
            echo "::error::Image $TARGET already exists on Docker Hub. Bump the version and retry."
            exit 1
          fi
          echo "OK: $TARGET does not exist yet — proceeding to build."

      - name: Read PREFECT_VERSION from pyproject.toml
        id: prefect
        run: |
          VERSION=$(grep -m1 'prefect==' prefect-proxy/pyproject.toml \
            | sed 's/.*prefect==\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building with PREFECT_VERSION=$VERSION"

      - name: Build & push
        run: |
          docker build \
            --build-arg PREFECT_VERSION=${{ steps.prefect.outputs.version }} \
            -f docker/Dockerfile.job-runner \
            -t ${{ env.IMAGE }}:${{ inputs.image_tag }} \
            prefect-proxy/
          docker push ${{ env.IMAGE }}:${{ inputs.image_tag }}

      - name: Summary
        run: |
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE }}:${{ inputs.image_tag }}\` (linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "Prefect version: \`${{ steps.prefect.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
