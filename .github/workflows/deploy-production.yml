name: Deploy to Production

# Manual-only. Deploys the current tip of main.
# Owner-gated via `environment: production` reviewers.
#
# Image tags: ghcr.io/<owner>/dalgo-<service>:prod-<short-sha>

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Resolve main HEAD, compute tag/owner
  # ─────────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
      image_tag:  ${{ steps.resolve.outputs.image_tag }}
      owner_lc:   ${{ steps.resolve.outputs.owner_lc }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(gh api repos/${{ github.repository }}/commits/main --jq '.sha')
          SHORT_SHA="${SHA:0:7}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "deploy_ref=$SHA"
            echo "image_tag=prod-$SHORT_SHA"
            echo "owner_lc=$OWNER_LC"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # Build + push non-webapp services (parallel)
  # ─────────────────────────────────────────────────────────────────────────
  build:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            dockerfile: docker/Dockerfile.backend
            image: dalgo-backend
          - service: prefect-proxy
            dockerfile: docker/Dockerfile.prefect-proxy
            image: dalgo-prefect-proxy
          - service: ai-llm-service
            dockerfile: docker/Dockerfile.ai-llm-service
            image: dalgo-ai-llm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.deploy_ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ needs.plan.outputs.owner_lc }}/${{ matrix.image }}:${{ needs.plan.outputs.image_tag }}
          cache-from: type=gha,scope=prod-${{ matrix.service }}
          cache-to:   type=gha,scope=prod-${{ matrix.service }},mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Build + push webapp (separate job — needs NEXT_PUBLIC_* with prod values)
  # ─────────────────────────────────────────────────────────────────────────
  build-webapp:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.deploy_ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push webapp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.webapp
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ needs.plan.outputs.owner_lc }}/dalgo-webapp:${{ needs.plan.outputs.image_tag }}
          cache-from: type=gha,scope=prod-webapp
          cache-to:   type=gha,scope=prod-webapp,mode=max
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_EMBEDDED_WEBAPP_URL=${{ vars.NEXT_PUBLIC_EMBEDDED_WEBAPP_URL }}
            NEXT_PUBLIC_WEBAPP_ENVIRONMENT=production
            NEXT_PUBLIC_USAGE_DASHBOARD_ID=${{ secrets.NEXT_PUBLIC_USAGE_DASHBOARD_ID }}
            NEXT_PUBLIC_USAGE_DASHBOARD_DOMAIN=${{ vars.NEXT_PUBLIC_USAGE_DASHBOARD_DOMAIN }}
            NEXT_PUBLIC_DOCS_BASE_URL=${{ vars.NEXT_PUBLIC_DOCS_BASE_URL }}
            NEXT_PUBLIC_AIRBYTE_URL=${{ vars.NEXT_PUBLIC_AIRBYTE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_POSTHOG_INGEST_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_INGEST_HOST }}
            POSTHOG_PROXY_HOST=${{ vars.POSTHOG_PROXY_HOST }}
            POSTHOG_PROXY_ASSETS_HOST=${{ vars.POSTHOG_PROXY_ASSETS_HOST }}

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy: SSH to prod, sync checkout, pull, up -d, migrate forward
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [plan, build, build-webapp]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync server checkout to deploy ref
        env:
          DEPLOY_REF:  ${{ needs.plan.outputs.deploy_ref }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH || '/home/ddp/dalgo' }}
          SSH_HOST:    ${{ vars.PROD_SSH_HOST }}
          SSH_USER:    ${{ vars.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          ssh "$SSH_USER@$SSH_HOST" bash -s <<EOF
            set -euo pipefail
            cd $DEPLOY_PATH
            git fetch origin $DEPLOY_REF
            git -c advice.detachedHead=false checkout $DEPLOY_REF
          EOF

      - name: Pull image and restart stack
        env:
          IMAGE_TAG:   ${{ needs.plan.outputs.image_tag }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH || '/home/ddp/dalgo' }}
          SSH_HOST:    ${{ vars.PROD_SSH_HOST }}
          SSH_USER:    ${{ vars.PROD_SSH_USER }}
          OWNER_LC:    ${{ needs.plan.outputs.owner_lc }}
          GH_ACTOR:    ${{ github.actor }}
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REGISTRY="ghcr.io/${OWNER_LC}/"

          ssh "$SSH_USER@$SSH_HOST" bash -s <<EOF
            set -euo pipefail
            cd $DEPLOY_PATH/docker
            echo "$GH_TOKEN" | docker login ghcr.io -u $GH_ACTOR --password-stdin
            export REGISTRY=$REGISTRY
            export BACKEND_IMAGE_TAG=$IMAGE_TAG
            export LLM_IMAGE_TAG=$IMAGE_TAG
            export PROXY_IMAGE_TAG=$IMAGE_TAG
            export WEBAPP_IMAGE_TAG=$IMAGE_TAG
            docker compose pull
            docker compose up -d
          EOF

      - name: Run post-deploy (migrate, seeds, system user, role cache)
        env:
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH || '/home/ddp/dalgo' }}
          SSH_HOST:    ${{ vars.PROD_SSH_HOST }}
          SSH_USER:    ${{ vars.PROD_SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "cd $DEPLOY_PATH/docker && \
            docker compose exec -T backend bash scripts/post-deploy.sh"

      - name: Summary
        env:
          IMAGE_TAG:  ${{ needs.plan.outputs.image_tag }}
          DEPLOY_REF: ${{ needs.plan.outputs.deploy_ref }}
        run: |
          {
            echo "## Production deploy complete"
            echo "- Ref: \`$DEPLOY_REF\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
