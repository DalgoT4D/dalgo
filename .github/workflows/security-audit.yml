name: Security Audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Space-separated directories to audit (e.g. 'backend/ webapp/'). Defaults to backend, webapp, docker, prefect-proxy."
        required: false
        default: "backend/ webapp/ docker/ prefect-proxy/"
      model:
        description: "Claude model to use for the audit."
        required: false
        default: "claude-sonnet-4-6"

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install security-audit skill
        run: |
          mkdir -p ~/.claude/skills
          git clone --depth=1 https://github.com/cloudflare/security-audit-skill /tmp/security-audit-skill
          cp -r /tmp/security-audit-skill/skills/security-audit ~/.claude/skills/

      - name: Build prompt
        id: vars
        run: |
          SCOPE="${{ github.event.inputs.scope }}"
          echo "prompt=Do a full security audit of these directories: ${SCOPE}. Save all findings artifacts (architecture.md, coverage-ledger.json, findings.json, REPORT.md, FINDINGS-DETAIL.md) to ~/security-audit-output/." >> "$GITHUB_OUTPUT"

      - name: Run security audit
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: agent
          model: ${{ github.event.inputs.model }}
          direct_prompt: ${{ steps.vars.outputs.prompt }}

      - name: Collect findings
        if: always()
        run: |
          mkdir -p /tmp/audit-findings
          # Explicit output dir (from prompt instruction)
          [ -d ~/security-audit-output ] && cp -r ~/security-audit-output/. /tmp/audit-findings/
          # Skill default output dir (fallback if Claude ignored the prompt)
          [ -d ~/security-audit-skill ] && cp -r ~/security-audit-skill/. /tmp/audit-findings/

      - name: Zip findings
        if: always()
        run: zip -r /tmp/security-audit-findings.zip /tmp/audit-findings/ || true

      - name: Email findings via SES
        if: always()
        env:
          SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
          SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
          SES_SENDER_EMAIL: ${{ vars.SES_SENDER_EMAIL }}
          SECURITY_AUDIT_MAIL_TO: ${{ vars.SECURITY_AUDIT_MAIL_TO }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SCOPE: ${{ github.event.inputs.scope }}
        run: |
          python3 - <<'EOF'
          import boto3, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders

          ses = boto3.client(
              "ses",
              region_name=os.environ.get("AWS_DEFAULT_REGION", "ap-south-1"),
              aws_access_key_id=os.environ["SES_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["SES_SECRET_ACCESS_KEY"],
          )

          msg = MIMEMultipart()
          msg["Subject"] = f"Security Audit Report — {os.environ['REPO']} @ {os.environ['BRANCH']}"
          msg["From"] = f"Dalgo Security Audit <{os.environ['SES_SENDER_EMAIL']}>"
          msg["To"] = os.environ["SECURITY_AUDIT_MAIL_TO"]

          body = (
              f"Security audit completed for {os.environ['REPO']}.\n\n"
              f"Branch: {os.environ['BRANCH']}\n"
              f"Scope: {os.environ['SCOPE']}\n"
              f"Run: {os.environ['RUN_URL']}\n\n"
              "Findings are attached. See REPORT.md for the summary and FINDINGS-DETAIL.md for full details."
          )
          msg.attach(MIMEText(body, "plain"))

          zip_path = "/tmp/security-audit-findings.zip"
          if os.path.exists(zip_path):
              with open(zip_path, "rb") as f:
                  part = MIMEBase("application", "zip")
                  part.set_payload(f.read())
                  encoders.encode_base64(part)
                  part.add_header("Content-Disposition", "attachment", filename="security-audit-findings.zip")
                  msg.attach(part)

          ses.send_raw_email(
              Source=os.environ["SES_SENDER_EMAIL"],
              Destinations=[os.environ["SECURITY_AUDIT_MAIL_TO"]],
              RawMessage={"Data": msg.as_string()},
          )
          print("Email sent successfully.")
          EOF
