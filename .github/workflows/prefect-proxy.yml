name: Prefect Proxy CI

on:
  push:
    branches: [main]
    paths:
      - 'prefect-proxy/**'
      - 'docker/Dockerfile.prefect-proxy*'
  pull_request:
    branches: [main]
    paths:
      - 'prefect-proxy/**'
      - 'docker/Dockerfile.prefect-proxy*'

defaults:
  run:
    working-directory: prefect-proxy

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Create logs directory
        run: mkdir -p logs

      - name: Create Google credentials file
        run: echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > /tmp/google_credentials.json

      - name: Test with pytest
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google_credentials.json
          LOGDIR: ${{ github.workspace }}/prefect-proxy/logs
        run: |
          uv run coverage run -m pytest --durations=20 --asyncio-mode=auto
          uv run coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: prefect-proxy
          fail_ci_if_error: true

      - name: Check coverage threshold
        run: uv run coverage report --fail-under=68
