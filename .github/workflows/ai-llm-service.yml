name: AI LLM Service CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-llm-service/**'
      - 'docker/Dockerfile.ai-llm-service'
  pull_request:
    branches: [main]
    paths:
      - 'ai-llm-service/**'
      - 'docker/Dockerfile.ai-llm-service'

defaults:
  run:
    working-directory: ai-llm-service

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (incl. dev group)
        run: uv sync --group dev

      - name: Test with pytest
        run: |
          uv run coverage run -m pytest --durations=20
          uv run coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ai-llm-service
          fail_ci_if_error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: docker/Dockerfile.ai-llm-service
          push: false
          tags: dalgo-ai-llm:ci
