# Production compose — builds prod images, no bind mounts, no hot reload.
# Postgres and Prefect server are managed externally; configure via each service's .env.
# Redis is included here (used by backend Celery and ai-llm-service).
#
# Run from this directory:
#   docker compose build
#   docker compose up -d
#   docker compose up -d backend   # single service

name: dalgo

x-backend: &backend
  image: dalgo-backend:${BACKEND_IMAGE_TAG:-latest}
  env_file: ../backend/.env
  environment:
    REDIS_HOST: redis
    REDIS_PORT: ${REDIS_PORT:-6379}
    DBPORT: ${DBPORT:-5432}
    PREFECT_HTTP_TIMEOUT: ${PREFECT_HTTP_TIMEOUT:-30}
    PREFECT_RETRY_CRASHED_FLOW_RUNS: ${PREFECT_RETRY_CRASHED_FLOW_RUNS:-False}
    PREFECT_AIRBYTE_TASKS_TIMEOUT_SECS: ${PREFECT_AIRBYTE_TASKS_TIMEOUT_SECS:-60}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
    AIRBYTE_SERVER_APIVER: ${AIRBYTE_SERVER_APIVER:-v1}
    AIRBYTE_USE_SSL: ${AIRBYTE_USE_SSL:-false}
    LLM_SERVICE_API_URL: http://ai-llm-service:7001
    LLM_SERVICE_API_VER: ${LLM_SERVICE_API_VER:-v1}
  volumes:
    - ${CLIENTDBT_ROOT_MOUNT}:${CLIENTDBT_ROOT_MOUNT}
    - ${DBT_VENV_MOUNT}:${DBT_VENV_MOUNT}
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "airbyte-abctl-airbyte-server-svc.airbyte-abctl.svc.cluster.local:host-gateway"
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

x-ai-llm: &ai-llm
  image: dalgo-ai-llm:${LLM_IMAGE_TAG:-latest}
  env_file: ../ai-llm-service/.env
  environment:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    CELERY_BROKER: redis://redis:6379/0
    AI_PLATFORM_POLLING_INTERVAL_SECS: ${AI_PLATFORM_POLLING_INTERVAL_SECS:-30}
    AI_PLATFORM_REQUEST_TIMEOUT_SECS: ${AI_PLATFORM_REQUEST_TIMEOUT_SECS:-120}
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    <<: *backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: backend
    ports:
      - "${BACKEND_HOST_PORT:-8002}:8002"

  celery-worker:
    <<: *backend
    command: uv run celery -A ddpui worker -n ddpui -Q default
    depends_on:
      - backend

  celery-canvasdbt-worker:
    <<: *backend
    command: uv run celery -A ddpui worker -n ddpui -Q canvas_dbt --autoscale=3,1
    depends_on:
      - backend

  celery-alerts-worker:
    <<: *backend
    command: uv run celery -A ddpui worker -n ddpui-q -Q alerts
    depends_on:
      - backend

  celery-beat:
    <<: *backend
    command: uv run celery -A ddpui beat --scheduler redbeat.RedBeatScheduler
    depends_on:
      - backend

  # ── Prefect ────────────────────────────────────────────────────────────────
  prefect-server:
    image: dalgo-prefect-proxy:${PROXY_IMAGE_TAG:-latest}
    container_name: prefect-server
    command: uv run prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.prefect
      - ../prefect-proxy/profiles.toml:/root/.prefect/profiles.toml:ro
    restart: unless-stopped

  prefect-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prefect-proxy
    image: dalgo-prefect-proxy:${PROXY_IMAGE_TAG:-latest}
    container_name: prefect-proxy
    env_file: ../prefect-proxy/.env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_PROXY_API_PORT: ${PREFECT_PROXY_API_PORT:-8080}
      PREFECT_API_TIMEOUT: ${PREFECT_API_TIMEOUT:-30}
      PREFECT_API_RETRY: ${PREFECT_API_RETRY:-false}
      PREFECT_API_RETRY_DELAY: ${PREFECT_API_RETRY_DELAY:-3}
      PREFECT_PROXY_GIT_BRANCH: ${PREFECT_PROXY_GIT_BRANCH:-main}
      LOGDIR: ${LOGDIR:-logs}
    ports:
      - "${PROXY_HOST_PORT:-8080}:8080"
    depends_on:
      - prefect-server
    restart: unless-stopped

  prefect-worker-ddp-1:
    image: dalgo-prefect-proxy:${PROXY_IMAGE_TAG:-latest}
    container_name: prefect-worker-ddp-1
    command: sh -c "uv run prefect worker start --pool $${PREFECT_WORK_POOL:-dalgo_work_pool} -q ddp"
    env_file: ../prefect-proxy/.env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ${CLIENTDBT_ROOT_MOUNT}:${CLIENTDBT_ROOT_MOUNT}
      - ${DBT_VENV_MOUNT}:${DBT_VENV_MOUNT}
    depends_on:
      - prefect-server
    restart: unless-stopped

  prefect-worker-manual-dbt-1:
    image: dalgo-prefect-proxy:${PROXY_IMAGE_TAG:-latest}
    container_name: prefect-worker-manual-dbt-1
    command: sh -c "uv run prefect worker start --pool $${PREFECT_WORK_POOL:-dalgo_work_pool} -q manual-dbt"
    env_file: ../prefect-proxy/.env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ${CLIENTDBT_ROOT_MOUNT}:${CLIENTDBT_ROOT_MOUNT}
      - ${DBT_VENV_MOUNT}:${DBT_VENV_MOUNT}
    depends_on:
      - prefect-server
    restart: unless-stopped


  prefect-worker-dailybackup:
    image: dalgo-prefect-proxy:${PROXY_IMAGE_TAG:-latest}
    container_name: prefect-worker-dailybackup
    command: uv run prefect worker start --pool dailybackup
    env_file: ../prefect-proxy/.env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      - prefect-server
    restart: unless-stopped

  # ── Frontend ───────────────────────────────────────────────────────────────
  webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webapp
    image: dalgo-webapp:${WEBAPP_IMAGE_TAG:-latest}
    container_name: webapp
    env_file: ../webapp/.env
    ports:
      - "${WEBAPP_HOST_PORT:-3001}:3001"
    restart: unless-stopped

  # ── AI / LLM Service ───────────────────────────────────────────────────────
  ai-llm-service:
    <<: *ai-llm
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai-llm-service
    container_name: ai-llm-service
    command: uv run uvicorn main:app --port 7001 --host 0.0.0.0
    ports:
      - "${LLM_HOST_PORT:-7001}:7001"

  ai-llm-celery-worker:
    <<: *ai-llm
    command: uv run celery -A main.celery worker -n llm -Q llm --loglevel=INFO
    depends_on:
      - ai-llm-service

volumes:
  redis_data:
  prefect_data:
